[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hz-agent-base"
version = "0.5.7"
description = "Reusable Agent Harness infrastructure library — 权限控制、Hook 系统、记忆系统、知识库 RAG、文件审计、多 Agent 编排"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "HZ Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deepagents>=0.6.4,<0.7.0",
    "langchain-openai>=0.3.0",
    "langchain-deepseek>=1.0.0",
    "langgraph>=0.4.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.24.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
gemini = ["langchain-google-genai>=4.2.2"]
all-providers = [
    "hz-agent-base[anthropic,gemini]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/jiushiyouke/HZAgentBase"
Repository = "https://github.com/jiushiyouke/HZAgentBase"
"Bug Tracker" = "https://github.com/jiushiyouke/HZAgentBase/issues"

[project.scripts]
hz-agent = "hz_agent_base.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hz_agent_base"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
